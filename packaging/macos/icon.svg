<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="LocalMeetAssist">
  <!-- Знак с favicon.svg, вписанный в сетку иконки macOS: контент 824 из 1024,
       поля прозрачные. Так иконка не выглядит крупнее системных. -->
  <defs>
    <linearGradient id="lm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#26364a"/>
      <stop offset="1" stop-color="#7da5d2"/>
    </linearGradient>
  </defs>
  <g transform="translate(100 100) scale(12.875)">
    <rect width="64" height="64" rx="16" fill="url(#lm)"/>
    <text x="32" y="43" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="23" font-weight="800" letter-spacing="0.5" fill="#101820">LMA</text>
  </g>
</svg>
