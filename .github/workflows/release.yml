name: Release

# Собирает пакеты под каждую ОС на её собственном runner'е и прикладывает их
# к GitHub Release. CGO и платформенные SDK (WASAPI, CoreAudio, GTK) не
# кросс-компилируются, поэтому сборка идёт нативно на каждой системе.
#
# Запуск: git tag -a v0.1.0 -m "LocalMeetAssist 0.1.0" && git push origin v0.1.0
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег для релиза, например v0.1.0'
        required: true

permissions:
  contents: read

jobs:
  # Универсальный .app + .dmg: один файл на Intel и Apple Silicon, установка
  # перетаскиванием, разрешение на микрофон запрашивается один раз.
  macos-app:
    name: macOS app и dmg
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Собрать .app и .dmg
        shell: bash
        env:
          CGO_ENABLED: '1'
          # Подпись Developer ID включается секретом; без него скрипт делает
          # ad-hoc подпись и не нотаризует.
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          version="${tag#v}"
          ./scripts/make-app.sh "$version" dist

      - uses: actions/upload-artifact@v7
        with:
          name: localmeetassist-macos-app
          path: |
            dist/*.dmg
            dist/*.app
          if-no-files-found: error

  build:
    name: ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS не в матрице: там собирается универсальный .app и .dmg
          # отдельной задачей ниже.
          - { runner: ubuntu-24.04, goos: linux, goarch: amd64, ext: tar.gz }
          # Ubuntu 24.04, а не 26.04: чем старше glibc при сборке, тем на
          # большем числе дистрибутивов запустится бинарник.
          - { runner: ubuntu-24.04-arm, goos: linux, goarch: arm64, ext: tar.gz }
          - { runner: windows-latest, goos: windows, goarch: amd64, ext: zip }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Установить заголовки и пакетные инструменты для Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # rpm нужен только ради rpmbuild: .deb собирается dpkg-deb.
          sudo apt-get install -y libayatana-appindicator3-dev libx11-dev pkg-config rpm

      - name: Найти C-компилятор в Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          if ! command -v gcc >/dev/null 2>&1; then
            for dir in /c/mingw64/bin /c/msys64/mingw64/bin /c/tools/mingw64/bin; do
              if [ -x "$dir/gcc.exe" ]; then echo "$dir" >> "$GITHUB_PATH"; break; fi
            done
          fi
          gcc --version | head -1

      - name: Собрать и упаковать
        shell: bash
        env:
          CGO_ENABLED: '1'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          version="${tag#v}"
          binary="localmeetassist"
          [ "${GOOS}" = "windows" ] && binary="localmeetassist.exe"
          # Версия попадает в бинарник из тега: -version и /api/v1/health.
          ldflags="-s -w -X localmeetassist/internal/version.Version=${version}"
          if [ "${GOOS}" = "windows" ]; then
            # GUI-подсистема: при двойном клике не открывается консольное окно.
            # Ранние ошибки показывает MessageBox, см. cmd/localmeetassist.
            ldflags="${ldflags} -H=windowsgui"
          fi
          go build -trimpath -ldflags "${ldflags}" \
            -o "dist/${binary}" ./cmd/localmeetassist
          "./dist/${binary}" -version

          stage="stage/localmeetassist_${version}_${GOOS}_${GOARCH}"
          mkdir -p "$stage"
          cp "dist/${binary}" "$stage/"
          cp config.example.toml README.md LICENSE "$stage/"
          cp prompts/meeting_summary.md "$stage/"
          if [ "${GOOS}" = "windows" ]; then
            (cd stage && 7z a -tzip "../dist/localmeetassist_${version}_${GOOS}_${GOARCH}.zip" "localmeetassist_${version}_${GOOS}_${GOARCH}" >/dev/null)
          else
            tar -czf "dist/localmeetassist_${version}_${GOOS}_${GOARCH}.tar.gz" -C stage "localmeetassist_${version}_${GOOS}_${GOARCH}"
          fi
          if [ "${GOOS}" = "linux" ]; then
            # Пакеты для локальной установки: apt/dnf подтянут зависимости из
            # репозиториев дистрибутива, свой репозиторий не нужен.
            ./scripts/make-linux-package.sh "${version}" "${GOARCH}" "dist/${binary}" dist
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: localmeetassist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error

  release:
    needs: [build, macos-app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Checkout обязан идти первым: он очищает рабочую папку (git clean -ffdx)
      # и иначе удалил бы уже скачанные артефакты.
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # Свежие архивы расширения собираем здесь же, а не берём закоммиченные,
      # чтобы они всегда совпадали с исходниками.
      - name: Собрать расширение
        working-directory: browser-extension
        run: npm run package

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Добавить архивы расширения
        run: |
          set -euo pipefail
          # Только сборки для браузеров: исходный ZIP проекта в релизе не нужен.
          cp browser-extension/artifacts/localmeetassist-*.zip dist/
          ls -lh dist

      - name: Опубликовать релиз
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          version="${tag#v}"
          ls -lh dist
          # Повторный запуск не должен падать: сначала пробуем создать,
          # затем догружаем файлы с перезаписью.
          gh release create "$tag" \
            --title "LocalMeetAssist ${version}" \
            --generate-notes \
            dist/*.tar.gz dist/*.zip dist/*.dmg dist/*.deb dist/*.rpm \
          || gh release upload "$tag" dist/*.tar.gz dist/*.zip dist/*.dmg dist/*.deb dist/*.rpm --clobber
