whisper_small_url = "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small-q5_1.bin"
whisper_small_sha256 = "ae85e4a935d7a567bd102fe55afc16bb595bdb618e11b2fc7591bc08120411bb"
whisper_medium_url = "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-medium-q5_0.bin"
whisper_medium_sha256 = "19fea4b380c3a618ec4723c3eef2eb785ffba0d0538cf43f8f235e7b3b34220f"
whisper_turbo_url = "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-large-v3-turbo-q5_0.bin"
whisper_turbo_sha256 = "394221709cd5ad1f40c46e6031ca61bce88931e6e088c188294c6d5a55ffa7e2"

[summary]
# Только автоматический запуск после успешных предыдущих выбранных этапов.
auto_run = false
base_url = "http://127.0.0.1:8080/v1"
model = ""
token = ""
token_env = "MEETING_LLM_TOKEN"
timeout_seconds = 300
max_retries = 2
system_prompt = ""
# Язык ответа протокола: пусто — как язык интерфейса; либо ru/en.
language = ""
tls_verify = true
tls_ca_file = ""
tls_server_name = ""

[storage]
file_name_template = "{{date}}_{{time}}_{{title_slug}}_{{uid_short}}_{{artifact_type}}"
date_format = "2006-01-02"
time_format = "15-04-05"
audio_after_processing = "wav"
mp3_bitrate_kbps = 96
opus_bitrate_kbps = 32
keep_source_on_failure = true
database_path = "./data/database/meetings.db"
backup_count = 3
encoder_command = ""

[logging]
level = "info"
directory = "./data/logs"
max_file_mb = 20
max_files = 5
