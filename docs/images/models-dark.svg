<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="900" viewBox="0 0 1180 900">
  <rect width="1180" height="900" fill="#0b0e12"/><rect x="110" y="40" width="960" height="820" rx="18" fill="#191f28" stroke="#313b49"/>
  <text x="145" y="88" font-family="Arial" font-size="29" font-weight="700" fill="#e4e9f0">Модели</text><text x="145" y="116" font-family="Arial" font-size="13" fill="#9aa6b5">ONNX Runtime и модели загружаются отдельно. LocalMeetAssist обращается к ним напрямую — без CLI и Python.</text><text x="1030" y="82" font-family="Arial" font-size="28" text-anchor="middle" fill="#9aa6b5">×</text>
  <g font-family="Arial"><rect x="140" y="146" width="900" height="135" rx="14" fill="#202733" stroke="#313b49"/><rect x="140" y="146" width="900" height="56" rx="14" fill="#252e3a"/><text x="160" y="174" font-size="17" font-weight="700" fill="#e4e9f0">Среда выполнения</text><text x="160" y="193" font-size="11" fill="#9aa6b5">Нативные библиотеки ONNX Runtime и whisper.cpp для текущей ОС и архитектуры.</text><text x="164" y="231" font-size="14" font-weight="700" fill="#e4e9f0">ONNX Runtime 1.23.2</text><text x="164" y="253" font-size="11" fill="#75bd98">Установлена · 41,2 МБ · применяется</text><rect x="891" y="218" width="92" height="34" rx="9" fill="#191f28" stroke="#313b49"/><text x="937" y="240" text-anchor="middle" font-size="12" fill="#e4e9f0">Проверить</text>
  <rect x="140" y="299" width="900" height="257" rx="14" fill="#202733" stroke="#313b49"/><rect x="140" y="299" width="900" height="66" rx="14" fill="#252e3a"/><text x="160" y="327" font-size="17" font-weight="700" fill="#e4e9f0">Перевод речи в текст</text><text x="160" y="348" font-size="11" fill="#9aa6b5">GigaAM v3 ориентирована на русскую речь; Whisper даёт мультиязычность и несколько профилей качества.</text><rect x="156" y="382" width="868" height="76" rx="11" fill="#26364a" stroke="#7da5d2"/><text x="174" y="409" font-size="14" font-weight="700" fill="#e4e9f0">GigaAM v3 E2E RNNT INT8</text><text x="174" y="431" font-size="11" fill="#9aa6b5">Русская речь, пунктуация и нормализация · около 227 МБ</text><text x="174" y="448" font-size="11" fill="#75bd98">Установлена · применяется</text><rect x="872" y="403" width="126" height="34" rx="9" fill="#7da5d2"/><text x="935" y="425" text-anchor="middle" font-size="12" font-weight="700" fill="#101820">Применена</text>
  <rect x="156" y="468" width="868" height="72" rx="11" fill="#202733" stroke="#313b49"/><text x="174" y="495" font-size="14" font-weight="700" fill="#e4e9f0">Whisper large-v3-turbo Q5_0</text><text x="174" y="518" font-size="11" fill="#9aa6b5">Мультиязычная модель максимального качества из предложенных · около 574 МБ</text><rect x="858" y="487" width="140" height="34" rx="9" fill="#191f28" stroke="#313b49"/><text x="928" y="509" text-anchor="middle" font-size="12" fill="#e4e9f0">Скачать</text>
  <rect x="140" y="574" width="900" height="122" rx="14" fill="#202733" stroke="#313b49"/><rect x="140" y="574" width="900" height="54" rx="14" fill="#252e3a"/><text x="160" y="605" font-size="17" font-weight="700" fill="#e4e9f0">Фильтрация речи</text><text x="164" y="658" font-size="14" font-weight="700" fill="#e4e9f0">Silero VAD 6.2 ONNX</text><text x="164" y="678" font-size="11" fill="#75bd98">Установлена · отделяет речь от тишины</text>
  <rect x="140" y="714" width="900" height="104" rx="14" fill="#202733" stroke="#313b49"/><rect x="140" y="714" width="900" height="54" rx="14" fill="#252e3a"/><text x="160" y="745" font-size="17" font-weight="700" fill="#e4e9f0">Определение спикеров</text><text x="164" y="794" font-size="14" font-weight="700" fill="#e4e9f0">PyAnnote Segmentation 3.0 + WeSpeaker ResNet34-LM</text><text x="164" y="813" font-size="11" fill="#9aa6b5">Сегментация речи и сравнение голосовых признаков</text></g>
</svg>
